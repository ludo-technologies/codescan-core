name: Release jscan

on:
  push:
    tags:
      - "jscan/v*"

permissions:
  contents: write

# jscan depends on tree-sitter (cgo), so binaries must be built natively on
# each platform's runner — cross-compilation with CGO_ENABLED=0 does not work.
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jscan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: jscan/go.mod

      - name: Get version
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#jscan/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi

          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          go build -ldflags="-s -w \
            -X github.com/ludo-technologies/polyscan/jscan/internal/version.Version=${VERSION} \
            -X github.com/ludo-technologies/polyscan/jscan/internal/version.Commit=${COMMIT} \
            -X github.com/ludo-technologies/polyscan/jscan/internal/version.Date=${DATE} \
            -X github.com/ludo-technologies/polyscan/jscan/internal/version.BuiltBy=release" \
            -o jscan${EXT} ./cmd/jscan

          ARCHIVE_NAME="jscan_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${ARCHIVE_NAME}.zip" jscan${EXT}
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" jscan${EXT}
          fi

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: jscan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: jscan/jscan_*

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: jscan/jscan${{ matrix.goos == 'windows' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#jscan/v}" >> "$GITHUB_OUTPUT"

      - name: Download archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jscan-*
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum jscan_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: jscan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: binary-*

      - name: Place binaries into platform packages
        run: |
          cp ../binaries/binary-darwin-arm64/jscan npm/platforms/darwin-arm64/bin/jscan
          cp ../binaries/binary-linux-amd64/jscan npm/platforms/linux-x64/bin/jscan
          cp ../binaries/binary-linux-arm64/jscan npm/platforms/linux-arm64/bin/jscan
          cp ../binaries/binary-windows-amd64/jscan.exe npm/platforms/windows-x64/bin/jscan.exe
          chmod +x npm/platforms/darwin-arm64/bin/jscan npm/platforms/linux-x64/bin/jscan npm/platforms/linux-arm64/bin/jscan

      - name: Set package versions
        run: |
          VERSION="${GITHUB_REF_NAME#jscan/v}"
          for dir in npm/platforms/*/; do
            (cd "$dir" && npm version "$VERSION" --no-git-tag-version)
          done
          (cd npm && npm version "$VERSION" --no-git-tag-version)
          node -e "const fs=require('fs');const p=require('./npm/package.json');for(const d of Object.keys(p.optionalDependencies))p.optionalDependencies[d]='$VERSION';fs.writeFileSync('npm/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Publish platform packages
        run: |
          for dir in npm/platforms/*/; do
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish main package
        run: |
          cd npm && npm publish --access public --provenance
