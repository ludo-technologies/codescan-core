name: Release jscan

on:
  push:
    tags:
      - "jscan/v*"

permissions:
  contents: read

# jscan has merged into polyscan: the npm package is now a wrapper that runs
# the polyscan CLI, so there are no native builds and no GitHub release here
# anymore. This workflow only publishes the wrapper package on a jscan/v*
# tag, and keeps its filename so npm trusted publishing stays configured.
jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: jscan/npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set package version
        run: |
          VERSION="${GITHUB_REF_NAME#jscan/v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Publish wrapper package
        run: npm publish --access public --provenance
