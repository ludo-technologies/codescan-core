name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jscan: ${{ steps.filter.outputs.jscan }}
      polyscan: ${{ steps.filter.outputs.polyscan }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            jscan:
              - 'jscan/**'
              - 'core/**'
              - '.github/workflows/ci.yml'
            polyscan:
              - 'polyscan/**'
              - '.github/workflows/ci.yml'
            benchmarks:
              - 'benchmarks/**'
              - '.github/workflows/ci.yml'

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  jscan:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.jscan == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: jscan/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  polyscan:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.polyscan == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polyscan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: polyscan/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  benchmarks:
    needs: changes
    if: ${{ needs.changes.outputs.benchmarks == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/patch-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The benchmark is stdlib-only by design; ruff is the one dev tool, and
      # it is pinned so a new release cannot fail an unrelated PR.
      - run: pip install ruff==0.14.2
      - run: ruff check .
      - run: python3 -m unittest discover -s tests -v
      # The committed result set has to stay readable by the current report.py.
      - run: python3 report.py results/*.jsonl.gz --resolved-only
